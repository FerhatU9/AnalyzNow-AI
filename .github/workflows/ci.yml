name: AnalyzNow AI CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run standard tests
        run: python -m pytest -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build

  demo-smoke:
    name: Full-stack synthetic demo
    runs-on: ubuntu-latest
    env:
      FOOTBALL_DATA_SOURCE: csv
      FOOTBALL_CSV_PATH: data/synthetic_demo.csv
      FOOTBALL_API_URL: http://127.0.0.1:9011
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install API and UI
        run: |
          python -m pip install -e '.[dev]'
          npm --prefix frontend ci
      - name: Build Next.js
        run: npm --prefix frontend run build
      - name: Verify real API and web connections
        shell: bash
        run: |
          set -euo pipefail
          python -m uvicorn football_intel.api:app --host 127.0.0.1 --port 9011 > /tmp/analyznow-api.log 2>&1 &
          API_PID=$!
          npm --prefix frontend run start -- --hostname 127.0.0.1 --port 3011 > /tmp/analyznow-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$API_PID" "$WEB_PID" 2>/dev/null || true' EXIT
          python scripts/verify_demo.py || {
            cat /tmp/analyznow-api.log
            cat /tmp/analyznow-web.log
            exit 1
          }
