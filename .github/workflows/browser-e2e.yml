name: Browser End-to-End Tests

on:
  pull_request:
    paths:
      - "frontend/**"
      - "compose.demo.yaml"
      - "docker/**"
      - "src/**"
      - ".github/workflows/browser-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    name: Chromium browser journey
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_PASSWORD: github_actions_fictional_demo_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked browser test dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium and OS dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start isolated application services
        run: docker compose -f compose.demo.yaml up --build -d --wait
      - name: Verify browser journeys
        working-directory: frontend
        run: npx playwright test
      - name: Summarize containers and stop isolated stack
        if: always()
        run: |
          docker compose -f compose.demo.yaml ps || true
          docker compose -f compose.demo.yaml logs --tail=60 api web postgres seed || true
          docker compose -f compose.demo.yaml down --remove-orphans --volumes || true
      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore
