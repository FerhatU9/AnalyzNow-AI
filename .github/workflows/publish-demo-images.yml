name: Publish Demo Container Images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish synthetic-demo containers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Define lowercase image names
        id: names
        shell: bash
        run: |
          echo "api=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/analyznow-ai-api" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/analyznow-ai-web" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish FastAPI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/api.Dockerfile
          push: true
          tags: |
            ${{ steps.names.outputs.api }}:${{ steps.names.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=AnalyzNow AI fictional-data API
      - name: Publish Next.js image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/frontend.Dockerfile
          push: true
          tags: |
            ${{ steps.names.outputs.web }}:${{ steps.names.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=AnalyzNow AI public demonstration website
      - name: Show the immutable source revision tag
        shell: bash
        run: |
          echo "API: ${{ steps.names.outputs.api }}:${{ steps.names.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Web: ${{ steps.names.outputs.web }}:${{ steps.names.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "These new GitHub packages may be PRIVATE initially. Change BOTH image packages to PUBLIC in GitHub package settings before deploying without registry credentials." >> "$GITHUB_STEP_SUMMARY"
