
name: analyznow-ai

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: analyznow
      POSTGRES_USER: analyznow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set password in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyznow -d analyznow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
